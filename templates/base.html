{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <!-- METADATA & TITLES -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <title>{% block title %}Student Grids System{% endblock %}</title>


    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">


    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <!-- STYLESHEET -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    {% block extra_css %}{% endblock %}

</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="banner">
        <div class="nav-container">

            <!-- LOGO -->
            <a href="{% url 'home' %}" class="logo">
                <img src="{% static 'img/home/logo.svg' %}" alt="Icon of logo">
                <p>Student Grids</p>
            </a>

            {% if user.is_authenticated %}

                <!-- BASE ACTIONS -->
                <div>

                    <!-- MOBILE HAMBURGER BUTTON -->
                    <button class="navbar-toggler" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                        <span class="navbar-toggler-icon"></span>
                        <span class="navbar-toggler-icon"></span>
                    </button>


                    <!-- NAVIGATION LINKS & ACTIONS -->
                    <div class="nav-menu">
                        <div class="nav-actions">

                            <!-- LOGOUT FORM -->
                            <form method="post" action="{% url 'logout' %}">
                                {% csrf_token %}
                                <button type="submit" class="logout-btn">Logout</button>
                            </form>

                            <!-- CHANGE PASSWORD -->
                            <a href="{% url 'password_change' %}" class="change-pw-btn">Change Password</a>

                        </div>
                    </div>
                </div>

            {% endif %}

        </div>
    </nav>



    <!-- INHERITED PAGE CONTENT -->
    {% block content %}
    {% endblock %}

    
    <script>
        // ----- NAVBAR -----
        const navToggler = document.querySelector('.navbar-toggler');
        const navMenu = document.querySelector('.nav-menu');

        // Only run if the toggler exists (i.e. user is authenticated)
        if (navToggler) {

            // ----- TOGGLE MENU FUNCTION -----
            navToggler.addEventListener('click', () => {
                navMenu.classList.toggle('active');
                navToggler.classList.toggle('active');
            });

            // ----- CLOSE ON OUTSIDE CLICK -----
            document.addEventListener('click', (e) => {
                if (!e.target.closest('nav.banner')) {
                    navMenu.classList.remove('active');
                    navToggler.classList.remove('active');
                }
            });
        }
    </script>


    <!-- INHERITED PAGE SCRIPTS -->
    {% block extra_js %}
    {% endblock %}

</body>

</html>
